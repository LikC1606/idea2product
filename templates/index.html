<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idea2Product - AI Build Studio</title>
    <style>
        :root {
            --bg-primary: #1e1e2e;
            --bg-secondary: #181825;
            --bg-surface: #313244;
            --bg-hover: #45475a;
            --text-primary: #cdd6f4;
            --text-secondary: #a6adc8;
            --text-muted: #6c7086;
            --accent: #89b4fa;
            --accent-hover: #74c7ec;
            --green: #a6e3a1;
            --red: #f38ba8;
            --yellow: #f9e2af;
            --border: #45475a;
            --radius: 8px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-secondary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        /* ---- Header ---- */
        .header {
            height: 48px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 12px;
        }
        .header .logo { font-weight: 700; font-size: 1rem; color: var(--accent); }
        .header .new-btn {
            margin-left: auto;
            background: var(--accent);
            color: var(--bg-secondary);
            border: none;
            padding: 6px 14px;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .header .new-btn:hover { background: var(--accent-hover); }

        /* ---- Main layout ---- */
        .main {
            display: flex;
            height: calc(100vh - 48px);
        }

        /* ---- Left panel: Chat ---- */
        .panel-chat {
            width: 420px;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            background: var(--bg-primary);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg {
            max-width: 92%;
            padding: 10px 14px;
            border-radius: var(--radius);
            line-height: 1.55;
            font-size: 0.9rem;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .msg.user {
            align-self: flex-end;
            background: var(--accent);
            color: var(--bg-secondary);
            border-bottom-right-radius: 2px;
        }
        .msg.assistant {
            align-self: flex-start;
            background: var(--bg-surface);
            color: var(--text-primary);
            border-bottom-left-radius: 2px;
        }
        .msg.system {
            align-self: center;
            background: transparent;
            color: var(--text-muted);
            font-size: 0.8rem;
            text-align: center;
        }

        .welcome {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px;
            text-align: center;
        }
        .welcome h2 { font-size: 1.4rem; margin-bottom: 8px; color: var(--accent); }
        .welcome p { color: var(--text-secondary); margin-bottom: 24px; font-size: 0.9rem; line-height: 1.5; }

        .quick-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        .chip {
            padding: 8px 14px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.82rem;
            color: var(--text-secondary);
            transition: all .15s;
        }
        .chip:hover { border-color: var(--accent); color: var(--accent); }

        .chat-input-area {
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
        }
        .chat-input-area textarea {
            flex: 1;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text-primary);
            padding: 10px 12px;
            font-size: 0.9rem;
            font-family: inherit;
            resize: none;
            min-height: 42px;
            max-height: 120px;
        }
        .chat-input-area textarea:focus { outline: none; border-color: var(--accent); }
        .chat-input-area textarea::placeholder { color: var(--text-muted); }
        .chat-input-area button {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: var(--radius);
            background: var(--accent);
            color: var(--bg-secondary);
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .chat-input-area button:hover { background: var(--accent-hover); }
        .chat-input-area button:disabled { opacity: .4; cursor: default; }

        /* ---- Right panel: Code + Preview ---- */
        .panel-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
        }

        .right-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
            height: 40px;
        }
        .right-tab {
            padding: 0 20px;
            display: flex;
            align-items: center;
            font-size: 0.85rem;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            color: var(--text-secondary);
            transition: all .15s;
        }
        .right-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
        .right-tab:hover { color: var(--text-primary); }

        .right-content {
            flex: 1;
            overflow: hidden;
            position: relative;
        }
        .tab-pane {
            display: none;
            position: absolute;
            inset: 0;
        }
        .tab-pane.active { display: flex; }

        /* Code pane */
        .code-pane { display: flex; }
        .file-tree {
            width: 220px;
            overflow-y: auto;
            border-right: 1px solid var(--border);
            padding: 8px 0;
            background: var(--bg-primary);
        }
        .file-item {
            padding: 6px 16px;
            font-size: 0.82rem;
            cursor: pointer;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .file-item:hover { background: var(--bg-hover); color: var(--text-primary); }
        .file-item.active { background: var(--bg-surface); color: var(--accent); }

        .code-viewer {
            flex: 1;
            overflow: auto;
            padding: 16px;
        }
        .code-viewer pre {
            margin: 0;
            font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace;
            font-size: 0.82rem;
            line-height: 1.6;
            color: var(--text-primary);
            white-space: pre-wrap;
            word-break: break-all;
        }
        .code-viewer .placeholder {
            color: var(--text-muted);
            text-align: center;
            margin-top: 80px;
            font-size: 0.9rem;
        }

        /* Preview pane */
        .preview-pane {
            flex-direction: column;
        }
        .preview-pane iframe {
            flex: 1;
            border: none;
            background: #fff;
        }
        .preview-pane .no-preview {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Status bar */
        .status-bar {
            height: 28px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 16px;
            font-size: 0.75rem;
            color: var(--text-muted);
            gap: 16px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }
        .status-dot.idle { background: var(--text-muted); }
        .status-dot.processing { background: var(--yellow); animation: pulse 1s infinite; }
        .status-dot.completed { background: var(--green); }
        .status-dot.failed { background: var(--red); }

        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

        .typing-indicator { display: flex; gap: 4px; padding: 10px 14px; }
        .typing-indicator span {
            width: 7px; height: 7px; background: var(--text-muted);
            border-radius: 50%; animation: bounce .6s infinite alternate;
        }
        .typing-indicator span:nth-child(2) { animation-delay: .2s; }
        .typing-indicator span:nth-child(3) { animation-delay: .4s; }
        @keyframes bounce { to { transform: translateY(-5px); opacity: .4; } }
    </style>
</head>
<body>
    <div class="header">
        <span class="logo">Idea2Product</span>
        <button class="new-btn" onclick="newProject()">+ New Project</button>
    </div>

    <div class="main">
        <!-- Left: Chat -->
        <div class="panel-chat">
            <div class="chat-messages" id="chatMessages">
                <div class="welcome" id="welcome">
                    <h2>Idea2Product</h2>
                    <p>描述你想要的应用，AI 将在后台自动生成。<br>你可以随时补充需求，持续改进。</p>
                    <div class="quick-chips">
                        <span class="chip" onclick="quickSend('创建一个待办事项应用，支持添加、删除和标记完成')">待办事项</span>
                        <span class="chip" onclick="quickSend('创建一个博客系统，支持文章发布和评论')">博客系统</span>
                        <span class="chip" onclick="quickSend('创建一个在线笔记应用，支持Markdown')">在线笔记</span>
                        <span class="chip" onclick="quickSend('创建一个天气查询应用')">天气查询</span>
                    </div>
                </div>
            </div>
            <div class="chat-input-area">
                <textarea id="chatInput" placeholder="描述你想要的应用..." rows="1"
                          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"></textarea>
                <button id="sendBtn" onclick="sendMsg()">&#x2191;</button>
            </div>
        </div>

        <!-- Right: Code / Preview -->
        <div class="panel-right">
            <div class="right-tabs">
                <div class="right-tab active" data-tab="code" onclick="switchTab('code')">Code</div>
                <div class="right-tab" data-tab="preview" onclick="switchTab('preview')">Preview</div>
            </div>
            <div class="right-content">
                <div class="tab-pane code-pane active" id="paneCode">
                    <div class="file-tree" id="fileTree">
                        <div class="file-item" style="color:var(--text-muted);cursor:default;">等待生成...</div>
                    </div>
                    <div class="code-viewer" id="codeViewer">
                        <div class="placeholder">选择左侧文件查看代码</div>
                    </div>
                </div>
                <div class="tab-pane preview-pane" id="panePreview">
                    <div class="no-preview" id="noPreview">生成完成后将显示应用预览</div>
                    <iframe id="previewFrame" style="display:none;"></iframe>
                </div>
            </div>
        </div>
    </div>

    <div class="status-bar">
        <span><span class="status-dot idle" id="statusDot"></span><span id="statusText">Ready</span></span>
        <span id="statusStage"></span>
    </div>

<script>
let projectId = null;
let pollTimer = null;
let sending = false;
let currentFile = null;

// ---- Project lifecycle ----

async function newProject() {
    stopPolling();
    projectId = null;
    currentFile = null;
    document.getElementById('chatMessages').innerHTML = `
        <div class="welcome" id="welcome">
            <h2>Idea2Product</h2>
            <p>描述你想要的应用，AI 将在后台自动生成。<br>你可以随时补充需求，持续改进。</p>
            <div class="quick-chips">
                <span class="chip" onclick="quickSend('创建一个待办事项应用，支持添加、删除和标记完成')">待办事项</span>
                <span class="chip" onclick="quickSend('创建一个博客系统，支持文章发布和评论')">博客系统</span>
                <span class="chip" onclick="quickSend('创建一个在线笔记应用，支持Markdown')">在线笔记</span>
                <span class="chip" onclick="quickSend('创建一个天气查询应用')">天气查询</span>
            </div>
        </div>`;
    document.getElementById('fileTree').innerHTML = '<div class="file-item" style="color:var(--text-muted);cursor:default;">等待生成...</div>';
    document.getElementById('codeViewer').innerHTML = '<div class="placeholder">选择左侧文件查看代码</div>';
    document.getElementById('previewFrame').style.display = 'none';
    document.getElementById('noPreview').style.display = 'flex';
    setStatus('idle', 'Ready', '');
}

async function ensureProject() {
    if (projectId) return;
    const res = await fetch('/api/projects', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({start_chat: true})
    });
    const data = await res.json();
    projectId = data.project_id;
}

// ---- Chat ----

function quickSend(text) {
    document.getElementById('chatInput').value = text;
    sendMsg();
}

async function sendMsg() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text || sending) return;
    input.value = '';

    const wel = document.getElementById('welcome');
    if (wel) wel.remove();

    appendMsg('user', text);
    sending = true;
    document.getElementById('sendBtn').disabled = true;

    showTyping();

    try {
        await ensureProject();
        const res = await fetch(`/api/projects/${projectId}/chat`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({message: text})
        });
        const data = await res.json();
        removeTyping();
        if (data.reply) {
            appendMsg('assistant', data.reply);
        }
        startPolling();
    } catch (err) {
        removeTyping();
        appendMsg('system', '发送失败: ' + err.message);
    } finally {
        sending = false;
        document.getElementById('sendBtn').disabled = false;
        input.focus();
    }
}

function appendMsg(role, text) {
    const container = document.getElementById('chatMessages');
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
}

function showTyping() {
    const container = document.getElementById('chatMessages');
    let el = document.getElementById('typingIndicator');
    if (!el) {
        el = document.createElement('div');
        el.id = 'typingIndicator';
        el.className = 'typing-indicator';
        el.innerHTML = '<span></span><span></span><span></span>';
    }
    container.appendChild(el);
    container.scrollTop = container.scrollHeight;
}

function removeTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
}

// ---- Polling ----

function startPolling() {
    if (pollTimer) return;
    pollTimer = setInterval(pollStatus, 2500);
    pollStatus();
}

function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

async function pollStatus() {
    if (!projectId) return;
    try {
        const res = await fetch(`/api/projects/${projectId}/status`);
        const s = await res.json();
        const status = s.status || 'idle';
        setStatus(status, statusLabel(status, s.progress), s.current_stage || '');

        if (status === 'processing' || status === 'completed') {
            refreshFiles();
        }
        if (status === 'completed') {
            refreshPreview();
            stopPolling();
        }
        if (status === 'failed') {
            stopPolling();
        }
    } catch (e) { /* ignore */ }
}

function statusLabel(status, progress) {
    if (status === 'processing') return `Generating... ${progress || 0}%`;
    if (status === 'completed') return 'Done';
    if (status === 'failed') return 'Failed';
    return 'Ready';
}

function setStatus(status, text, stage) {
    const dot = document.getElementById('statusDot');
    dot.className = 'status-dot ' + status;
    document.getElementById('statusText').textContent = text;
    document.getElementById('statusStage').textContent = stage;
}

// ---- Files panel ----

async function refreshFiles() {
    if (!projectId) return;
    try {
        const res = await fetch(`/api/projects/${projectId}/files`);
        const data = await res.json();
        const tree = document.getElementById('fileTree');
        if (!data.files || data.files.length === 0) return;

        tree.innerHTML = '';
        data.files.forEach(f => {
            const div = document.createElement('div');
            div.className = 'file-item' + (f.path === currentFile ? ' active' : '');
            div.textContent = f.path;
            div.title = f.path;
            div.onclick = () => loadFile(f.path);
            tree.appendChild(div);
        });

        if (!currentFile && data.files.length > 0) {
            loadFile(data.files[0].path);
        }
    } catch (e) { /* ignore */ }
}

async function loadFile(path) {
    if (!projectId) return;
    currentFile = path;
    document.querySelectorAll('.file-item').forEach(el => {
        el.classList.toggle('active', el.textContent === path);
    });
    try {
        const res = await fetch(`/api/projects/${projectId}/file/${encodeURIComponent(path)}`);
        const data = await res.json();
        document.getElementById('codeViewer').innerHTML = '<pre>' + escapeHtml(data.content || '') + '</pre>';
    } catch (e) {
        document.getElementById('codeViewer').innerHTML = '<div class="placeholder">Failed to load file</div>';
    }
}

// ---- Preview panel ----

async function refreshPreview() {
    if (!projectId) return;
    try {
        const res = await fetch(`/api/projects/${projectId}/preview-url`);
        const data = await res.json();
        if (data.running && data.preview_url) {
            const frame = document.getElementById('previewFrame');
            frame.src = data.preview_url;
            frame.style.display = 'block';
            document.getElementById('noPreview').style.display = 'none';
        }
    } catch (e) { /* ignore */ }
}

// ---- Tab switching ----

function switchTab(tab) {
    document.querySelectorAll('.right-tab').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));
    document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));
    document.getElementById(tab === 'code' ? 'paneCode' : 'panePreview').classList.add('active');
}

// ---- Helpers ----

function escapeHtml(s) {
    const map = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
    return s.replace(/[&<>"']/g, c => map[c]);
}
</script>
</body>
</html>
