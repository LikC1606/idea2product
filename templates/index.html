<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idea2Product - AI应用生成平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #343541;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #343541;
            border-bottom: 1px solid #565869;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
        }

        .header h1 {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .header .new-chat-btn {
            background: #10a37f;
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .main-container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            padding: 20px;
            overflow-y: auto;
        }

        .message {
            display: flex;
            gap: 20px;
            padding: 20px 0;
            border-bottom: 1px solid #565869;
        }

        .message.user .message-icon {
            background: #5436da;
            color: white;
        }

        .message.assistant .message-icon {
            background: #10a37f;
            color: white;
        }

        .message-icon {
            width: 30px;
            height: 30px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .message-content {
            flex: 1;
            color: #ececf1;
            line-height: 1.6;
        }

        .questions-section {
            background: #444654;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
        }

        .questions-section h4 {
            color: #ececf1;
            margin-bottom: 12px;
            font-size: 0.95rem;
        }

        .question-item {
            margin-bottom: 12px;
        }

        .question-item label {
            display: block;
            color: #acacbe;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }

        .question-item input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #565869;
            border-radius: 6px;
            background: #343541;
            color: #ececf1;
            font-size: 0.95rem;
        }

        .question-item input:focus {
            outline: none;
            border-color: #10a37f;
        }

        .progress-section {
            background: #444654;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
        }

        .progress-section h4 {
            color: #ececf1;
            margin-bottom: 12px;
        }

        .progress-bar-container {
            background: #343541;
            border-radius: 10px;
            height: 20px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, #10a37f, #1a7f5a);
            height: 100%;
            border-radius: 10px;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.8rem;
        }

        .progress-text {
            color: #acacbe;
            font-size: 0.9rem;
            text-align: center;
        }

        .welcome-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ececf1;
            padding: 40px;
        }

        .welcome-screen h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .welcome-screen p {
            color: #acacbe;
            margin-bottom: 40px;
            max-width: 500px;
            text-align: center;
            line-height: 1.6;
        }

        .quick-prompts {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 600px;
            width: 100%;
        }

        .quick-prompt {
            background: #40414f;
            border: 1px solid #565869;
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.2s;
            color: #ececf1;
        }

        .quick-prompt:hover {
            background: #4a4b5c;
            border-color: #10a37f;
        }

        .quick-prompt h4 {
            font-size: 0.95rem;
            margin-bottom: 5px;
        }

        .quick-prompt p {
            font-size: 0.8rem;
            color: #acacbe;
            margin: 0;
        }

        .input-container {
            padding: 20px;
            background: #343541;
            border-top: 1px solid #565869;
        }

        .input-wrapper {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
        }

        .input-wrapper textarea {
            width: 100%;
            padding: 16px 20px;
            padding-right: 60px;
            border: 1px solid #565869;
            border-radius: 12px;
            background: #40414f;
            color: #ececf1;
            font-size: 1rem;
            font-family: inherit;
            resize: none;
            min-height: 56px;
            max-height: 200px;
        }

        .input-wrapper textarea:focus {
            outline: none;
            border-color: #10a37f;
        }

        .input-wrapper textarea::placeholder {
            color: #8e8ea0;
        }

        .send-btn {
            position: absolute;
            right: 12px;
            bottom: 12px;
            background: #10a37f;
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .send-btn:hover {
            background: #1a7f5a;
        }

        .loading {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #acacbe;
            padding: 10px 0;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid #565869;
            border-top-color: #10a37f;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden {
            display: none !important;
        }

        .btn-submit {
            background: #10a37f;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            margin-top: 15px;
        }

        .btn-submit:hover {
            background: #1a7f5a;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Idea2Product</h1>
        <button class="new-chat-btn" onclick="startNewChat()">新建对话</button>
    </div>

    <div class="main-container">
        <div class="chat-container" id="chatContainer">
            <div class="welcome-screen" id="welcomeScreen">
                <h1>Idea2Product</h1>
                <p>描述你想要的应用功能，AI将自动生成完整的代码并部署</p>

                <div class="quick-prompts">
                    <div class="quick-prompt" onclick="sendMessage('创建一个待办事项应用，支持添加、删除和完成待办')">
                        <h4>待办事项应用</h4>
                        <p>添加、删除、完成待办事项</p>
                    </div>
                    <div class="quick-prompt" onclick="sendMessage('创建一个博客系统，支持文章发布和评论')">
                        <h4>博客系统</h4>
                        <p>文章发布、评论功能</p>
                    </div>
                    <div class="quick-prompt" onclick="sendMessage('创建一个天气预报应用，显示未来一周天气')">
                        <h4>天气预报应用</h4>
                        <p>获取并展示天气预报</p>
                    </div>
                    <div class="quick-prompt" onclick="sendMessage('创建一个在线笔记应用，支持Markdown编辑')">
                        <h4>在线笔记</h4>
                        <p>Markdown编辑器</p>
                    </div>
                </div>
            </div>

            <div id="messagesContainer" class="hidden"></div>
        </div>
    </div>

    <div class="input-container">
        <div class="input-wrapper">
            <textarea id="userInput" placeholder="描述你想要的应用功能..." rows="1" onkeydown="handleKeyDown(event)"></textarea>
            <button class="send-btn" id="sendBtn" onclick="handleSend()">↑</button>
        </div>
    </div>

    <script>
        let currentProjectId = null;
        let pollInterval = null;
        let isWaitingForClarifications = false;
        let currentRequirement = '';
        let currentClarifications = {};

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                handleSend();
            }
        }

        function startNewChat() {
            document.getElementById('welcomeScreen').classList.remove('hidden');
            document.getElementById('messagesContainer').classList.add('hidden');
            document.getElementById('messagesContainer').innerHTML = '';
            currentProjectId = null;
            isWaitingForClarifications = false;
            if (pollInterval) {
                clearInterval(pollInterval);
                pollInterval = null;
            }
        }

        async function handleSend() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;
            await sendMessage(message);
        }

        async function sendMessage(message) {
            const input = document.getElementById('userInput');
            input.value = '';

            document.getElementById('welcomeScreen').classList.add('hidden');
            document.getElementById('messagesContainer').classList.remove('hidden');

            addMessage('user', message);

            const loadingId = showLoading();

            if (isWaitingForClarifications) {
                currentClarifications[getCurrentQuestion()] = message;
                const pendingInputs = document.querySelectorAll('.question-item input:not([data-answered="true"])');
                if (pendingInputs.length > 0) {
                    pendingInputs[0].setAttribute('data-answered', 'true');
                    pendingInputs[0].value = message;
                    showNextQuestion();
                    removeLoading(loadingId);
                    return;
                }
                isWaitingForClarifications = false;
                await createProjectWithClarifications(currentRequirement, currentClarifications);
                removeLoading(loadingId);
                return;
            }

            currentRequirement = message;

            try {
                const response = await fetch('/api/projects/clarify', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({requirement: message})
                });

                const data = await response.json();
                removeLoading(loadingId);

                if (data.questions && data.questions.length > 0) {
                    showClarificationQuestions(data.questions);
                } else {
                    await createProjectDirect(message);
                }
            } catch (error) {
                removeLoading(loadingId);
                addMessage('assistant', '抱歉，发生了错误: ' + error.message);
            }
        }

        function showClarificationQuestions(questions) {
            let html = '<div class="questions-section"><h4>请回答以下问题以完善需求：</h4>';
            questions.forEach((q, i) => {
                html += `<div class="question-item" id="question_${i}"><label>${q.question}</label><input type="text" placeholder="请输入..." data-question="${q.question}"></div>`;
            });
            html += '<button class="btn-submit" onclick="submitClarifications()">确认并生成</button></div>';
            addMessage('assistant', html);
            isWaitingForClarifications = true;
            currentClarifications = {};
        }

        function getCurrentQuestion() {
            const firstUnanswered = document.querySelector('.question-item input:not([data-answered="true"])');
            return firstUnanswered ? firstUnanswered.dataset.question : '';
        }

        function showNextQuestion() {
            const nextInput = document.querySelector('.question-item input:not([data-answered="true"])');
            if (nextInput) nextInput.focus();
        }

        function submitClarifications() {
            const inputs = document.querySelectorAll('.question-item input');
            inputs.forEach(input => {
                currentClarifications[input.dataset.question] = input.value;
            });
            createProjectWithClarifications(currentRequirement, currentClarifications);
        }

        async function createProjectDirect(requirement) {
            addMessage('assistant', '<div class="progress-section"><h4>正在创建项目...</h4><p>AI正在分析需求并生成代码</p></div>');
            try {
                const response = await fetch('/api/projects', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({requirement})
                });
                const data = await response.json();
                if (data.project_id) {
                    currentProjectId = data.project_id;
                    startPolling();
                } else {
                    addMessage('assistant', '创建失败: ' + (data.error || '未知错误'));
                }
            } catch (error) {
                addMessage('assistant', '创建失败: ' + error.message);
            }
        }

        async function createProjectWithClarifications(requirement, clarifications) {
            let summaryHtml = '<div class="questions-section"><h4>需求已完善：</h4>';
            for (const [q, a] of Object.entries(clarifications)) {
                summaryHtml += `<p><strong>${q}</strong>: ${a}</p>`;
            }
            summaryHtml += '</div>';
            addMessage('assistant', summaryHtml);
            addMessage('assistant', '<div class="progress-section" id="progressSection"><h4>正在生成应用...</h4><div class="progress-bar-container"><div class="progress-bar-fill" id="progressFill" style="width: 0%">0%</div></div><p class="progress-text" id="progressText">正在初始化...</p></div>');

            try {
                const response = await fetch('/api/projects', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({requirement, clarifications, interactive: true})
                });
                const data = await response.json();
                if (data.project_id) {
                    currentProjectId = data.project_id;
                    startPolling();
                } else {
                    addMessage('assistant', '创建失败: ' + (data.error || '未知错误'));
                }
            } catch (error) {
                addMessage('assistant', '创建失败: ' + error.message);
            }
        }

        function startPolling() {
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(async () => {
                if (!currentProjectId) return;
                try {
                    const response = await fetch(`/api/projects/${currentProjectId}/status`);
                    const status = await response.json();
                    updateProgress(status);
                    if (status.status === 'completed' || status.status === 'failed') {
                        clearInterval(pollInterval);
                        pollInterval = null;
                        if (status.status === 'completed') {
                            addMessage('assistant', '<div class="questions-section" style="background: #1a7f5a;"><h4>项目创建成功！</h4></div>');
                        } else {
                            addMessage('assistant', '<div class="questions-section" style="background: #7f1a1a;"><h4>项目创建失败</h4><p>' + (status.error || '未知错误') + '</p></div>');
                        }
                    }
                } catch (error) {
                    console.error('Poll error:', error);
                }
            }, 2000);
        }

        function updateProgress(status) {
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            if (progressFill) {
                progressFill.style.width = status.progress + '%';
                progressFill.textContent = status.progress + '%';
            }
            if (progressText) {
                progressText.textContent = (status.current_stage || '处理中...') + ' (' + status.progress + '%)';
            }
        }

        function addMessage(role, content) {
            const container = document.getElementById('messagesContainer');
            const icon = role === 'user' ? '👤' : '💡';
            container.insertAdjacentHTML('beforeend', '<div class="message ' + role + '"><div class="message-icon">' + icon + '</div><div class="message-content">' + content + '</div></div>');
            container.scrollTop = container.scrollHeight;
        }

        function showLoading() {
            const id = 'loading_' + Date.now();
            addMessage('assistant', '<div class="loading" id="' + id + '"><div class="spinner"></div><span>AI正在思考...</span></div>');
            return id;
        }

        function removeLoading(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }
    </script>
</body>
</html>
