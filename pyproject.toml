[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "idea2product"
version = "0.1.0"
description = "Multi-agent system for transforming requirements into production-ready web applications"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.54.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "astroid>=3.3.0",
    "aiofiles>=24.1.0",
    "requests>=2.32.0",
    "httpx>=0.28.0",
    "filelock>=3.13.0",
    "huggingface_hub>=0.25.0",
    "gunicorn>=21.0.0",
    "Pillow>=10.0.0",
    "selenium>=4.27.0",
    "pytest-bdd>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "types-requests>=2.31.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "black>=24.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
idea2product = "src.cli:main"

[tool.ruff]
target-version = "py39"
line-length = 100
select = ["E", "F", "I", "B", "C4"]
ignore = ["E501"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
