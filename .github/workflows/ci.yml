name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Run tests
        env:
          OPENAI_API_KEY: sk-dummy
        run: pytest tests/ -v --tb=short --cov=src --cov-report=term-missing --cov-fail-under=55

      - name: Reliability regression tests
        env:
          OPENAI_API_KEY: sk-dummy
        run: pytest tests/test_task_service_reliability.py tests/test_orchestrator_recovery.py tests/test_llm_service_retries.py -v --tb=short

      - name: Ruff check
        run: ruff check src/ tests/

      - name: MyPy
        run: mypy src/ --no-error-summary

      - name: Docs consistency check
        run: python scripts/check_docs.py
