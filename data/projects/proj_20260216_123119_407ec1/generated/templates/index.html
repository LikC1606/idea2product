<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Note-Taking App</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <h1>Simple Note-Taking App</h1>
        <form id="note-form">
            <textarea id="note-content" placeholder="Write your note here..." required></textarea>
            <button type="submit">Save Note</button>
        </form>
        <div id="notes-container">
            <h2>Saved Notes</h2>
            <ul id="notes-list"></ul>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const noteForm = document.getElementById('note-form');
            const noteContent = document.getElementById('note-content');
            const notesList = document.getElementById('notes-list');

            async function fetchNotes() {
                try {
                    const response = await fetch('/notes');
                    const notes = await response.json();
                    notesList.innerHTML = '';
                    notes.forEach(note => {
                        const li = document.createElement('li');
                        li.textContent = `${note.content} (Created: ${new Date(note.created_at).toLocaleString()})`;
                        notesList.appendChild(li);
                    });
                } catch (error) {
                    console.error('Error fetching notes:', error);
                }
            }

            async function saveNote(content) {
                try {
                    await fetch('/notes', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ content }),
                    });
                    noteContent.value = '';
                    fetchNotes();
                } catch (error) {
                    console.error('Error saving note:', error);
                }
            }

            noteForm.addEventListener('submit', function(event) {
                event.preventDefault();
                const content = noteContent.value.trim();
                if (content) {
                    saveNote(content);
                }
            });

            fetchNotes();
        });
    </script>
</body>
</html>
