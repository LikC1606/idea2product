<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Solution</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <nav>
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('problem_bp.problem_list') }}">Problems</a>
            <a href="{{ url_for('profile_bp.profile') }}">Profile</a>
            <a href="{{ url_for('leaderboard_bp.leaderboard') }}">Leaderboard</a>
        </nav>
    </header>
    <main>
        <h1>Submit Your Solution</h1>
        <form method="POST" action="{{ url_for('submission_bp.submit_solution', problem_id=problem.id) }}">
            <div>
                <label for="code">Your Code:</label>
                <textarea id="code" name="code" rows="15" cols="80" placeholder="Write your solution here..." required></textarea>
            </div>
            <div>
                <button type="submit">Submit</button>
            </div>
        </form>
        {% if error %}
            <div class="error">
                <p>{{ error }}</p>
            </div>
        {% endif %}
        {% if message %}
            <div class="message">
                <p>{{ message }}</p>
            </div>
        {% endif %}
    </main>
    <footer>
        <p>&copy; 2023 ACM Problem-Solving Platform</p>
    </footer>
</body>
</html>
