<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note-Taking App</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Simple Note-Taking App</h1>
        <form action="{{ url_for('notes_bp.add_note') }}" method="POST" class="mb-4">
            <div class="mb-3">
                <label for="noteContent" class="form-label">Write your note:</label>
                <textarea id="noteContent" name="content" class="form-control" rows="4" placeholder="Enter your note here..." required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Save Note</button>
        </form>
        <hr>
        <h2>Saved Notes:</h2>
        <ul class="list-group">
            {% for note in notes %}
            <li class="list-group-item">
                <p class="mb-1">{{ note.content }}</p>
                <small class="text-muted">Created on: {{ note.timestamp.strftime('%Y-%m-%d %H:%M:%S') }}</small>
            </li>
            {% endfor %}
        </ul>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
