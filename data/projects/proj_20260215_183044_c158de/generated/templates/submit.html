<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Solution</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <nav>
            <a href="{{ url_for('problem_bp.problem_list') }}">Problems</a>
            <a href="{{ url_for('user_bp.profile') }}">Profile</a>
            <a href="{{ url_for('user_bp.logout') }}">Logout</a>
        </nav>
    </header>
    <main>
        <section class="submit-section">
            <h1>Submit Your Solution</h1>
            <form action="{{ url_for('solution_bp.submit_solution') }}" method="POST" enctype="multipart/form-data">
                <label for="problem_id">Problem:</label>
                <select id="problem_id" name="problem_id" required>
                    {% for problem in problems %}
                    <option value="{{ problem.id }}">{{ problem.title }}</option>
                    {% endfor %}
                </select>

                <label for="solution_code">Code:</label>
                <textarea id="solution_code" name="solution_code" rows="10" required></textarea>

                <label for="language">Language:</label>
                <select id="language" name="language" required>
                    <option value="python">Python</option>
                    <option value="java">Java</option>
                    <option value="cpp">C++</option>
                </select>

                <button type="submit">Submit</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; ACM Problem-Solving Platform</p>
    </footer>
</body>
</html>
