<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Submission</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <header>
        <h1>ACM Problem-Solving Platform</h1>
        <nav>
            <ul>
                <li><a href="/problems">Problems</a></li>
                <li><a href="/profile">Profile</a></li>
                <li><a href="/leaderboard">Leaderboard</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Submit Your Code</h2>
            <form action="/submit" method="POST">
                <label for="problem_id">Select Problem:</label>
                <select id="problem_id" name="problem_id" required>
                    {% for problem in problems %}
                    <option value="{{ problem.id }}">{{ problem.title }}</option>
                    {% endfor %}
                </select>

                <label for="language">Programming Language:</label>
                <select id="language" name="language" required>
                    <option value="python">Python</option>
                    <option value="java">Java</option>
                    <option value="cpp">C++</option>
                </select>

                <label for="code">Your Code:</label>
                <textarea id="code" name="code" rows="10" required></textarea>

                <button type="submit">Submit</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2023 ACM Problem-Solving Platform</p>
    </footer>
</body>
</html>
