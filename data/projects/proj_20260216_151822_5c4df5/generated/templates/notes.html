<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Notes Management</title>
    <script>
        const API_BASE = '/api';

        async function fetchNotes() {
            const response = await fetch(`${API_BASE}/notes`);
            const notes = await response.json();
            const notesList = document.getElementById('notes-list');
            notesList.innerHTML = '';
            notes.forEach(note => {
                const noteItem = document.createElement('li');
                noteItem.textContent = `${note.content} (Category: ${note.category || 'None'}, Created at: ${new Date(note.created_at).toLocaleString()})`;
                noteItem.innerHTML += ` <button onclick="deleteNote(${note.id})">Delete</button>`;
                notesList.appendChild(noteItem);
            });
        }

        async function createNote() {
            const content = document.getElementById('note-content').value;
            const category = document.getElementById('note-category').value;
            if (!content) {
                alert('Content cannot be empty');
                return;
            }
            const response = await fetch(`${API_BASE}/notes`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ content, category })
            });
            if (response.ok) {
                document.getElementById('note-content').value = '';
                document.getElementById('note-category').value = '';
                fetchNotes();
            } else {
                alert('Failed to create note');
            }
        }

        async function deleteNote(noteId) {
            const response = await fetch(`${API_BASE}/notes/${noteId}`, {
                method: 'DELETE'
            });
            if (response.ok) {
                fetchNotes();
            } else {
                alert('Failed to delete note');
            }
        }

        async function searchNotes() {
            const query = document.getElementById('search-query').value;
            if (!query) {
                alert('Search query cannot be empty');
                return;
            }
            const response = await fetch(`${API_BASE}/notes/search?query=${query}`);
            const notes = await response.json();
            const notesList = document.getElementById('notes-list');
            notesList.innerHTML = '';
            notes.forEach(note => {
                const noteItem = document.createElement('li');
                noteItem.textContent = `${note.content} (Category: ${note.category || 'None'}, Created at: ${new Date(note.created_at).toLocaleString()})`;
                notesList.appendChild(noteItem);
            });
        }
    </script>
</head>
<body>
    <h1>Notes Management</h1>
    <div>
        <input type="text" id="note-content" placeholder="Note content">
        <input type="text" id="note-category" placeholder="Category">
        <button onclick="createNote()">Create Note</button>
    </div>
    <div>
        <input type="text" id="search-query" placeholder="Search notes">
        <button onclick="searchNotes()">Search</button>
    </div>
    <ul id="notes-list"></ul>
    <script>
        fetchNotes();
    </script>
</body>
</html>
