<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Detail</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #ffcccb;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        header h1 {
            margin: 0;
            font-size: 2.5em;
        }
        nav {
            margin: 20px;
            text-align: center;
        }
        nav a {
            text-decoration: none;
            color: #ff6f61;
            font-size: 1.2em;
            margin: 0 15px;
        }
        nav a:hover {
            text-decoration: underline;
        }
        .blog-detail {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .blog-detail h2 {
            margin: 0 0 10px;
            color: #ff6f61;
        }
        .blog-detail p {
            margin: 10px 0;
        }
        .blog-detail img {
            max-width: 100%;
            border-radius: 10px;
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const blogId = window.location.pathname.split('/').pop();
            fetch(`/api/blogs/${blogId}`)
                .then(response => response.json())
                .then(blog => {
                    document.querySelector('.blog-detail').innerHTML = `
                        <h2>${blog.title}</h2>
                        <p>${blog.description}</p>
                        ${blog.image_url ? `<img src="${blog.image_url}" alt="Blog Image">` : ''}
                    `;
                })
                .catch(error => {
                    console.error('Error fetching blog details:', error);
                });
        });
    </script>
</head>
<body>
    <header>
        <h1>Blog Detail</h1>
    </header>
    <nav>
        <a href="/">Home</a>
        <a href="/create">Create Blog</a>
    </nav>
    <div class="blog-detail">
        Loading blog details...
    </div>
</body>
</html>
