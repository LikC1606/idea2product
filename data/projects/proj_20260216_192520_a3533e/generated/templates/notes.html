<!DOCTYPE html>
<html>
<head>
    <title>Notes</title>
    <script>
        const API_BASE = '/api';

        async function fetchNotes() {
            const response = await fetch(`${API_BASE}/notes`);
            const notes = await response.json();
            displayNotes(notes, 'notes-list');
        }

        async function searchNotes() {
            const query = document.getElementById('search-query').value;
            const response = await fetch(`${API_BASE}/notes/search?query=${query}`);
            const notes = await response.json();
            displayNotes(notes, 'search-results');
        }

        function displayNotes(notes, elementId) {
            const notesList = document.getElementById(elementId);
            notesList.innerHTML = '';
            notes.forEach(note => {
                const li = document.createElement('li');
                li.innerHTML = `<strong>${note.title}</strong>: ${note.content} 
                <button onclick="editNote(${note.id}, '${note.title}', '${note.content}')">Edit</button>
                <button onclick="deleteNote(${note.id})">Delete</button>`;
                notesList.appendChild(li);
            });
        }

        async function createNote() {
            const title = document.getElementById('note-title').value;
            const content = document.getElementById('note-content').value;
            await fetch(`${API_BASE}/notes`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ title, content })
            });
            fetchNotes();
        }

        async function editNote(id, currentTitle, currentContent) {
            const newTitle = prompt('Edit Title:', currentTitle);
            const newContent = prompt('Edit Content:', currentContent);
            if (newTitle !== null && newContent !== null) {
                await fetch(`${API_BASE}/notes/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ title: newTitle, content: newContent })
                });
                fetchNotes();
            }
        }

        async function deleteNote(id) {
            if (confirm('Are you sure you want to delete this note?')) {
                await fetch(`${API_BASE}/notes/${id}`, {
                    method: 'DELETE'
                });
                fetchNotes();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchNotes();
            document.getElementById('create-note-btn').addEventListener('click', createNote);
            document.getElementById('search-btn').addEventListener('click', searchNotes);
        });
    </script>
</head>
<body>
    <h1>Notes</h1>
    <ul id="notes-list"></ul>

    <h2>Create Note</h2>
    <form id="create-note-form" onsubmit="return false;">
        <label for="note-title">Title:</label>
        <input type="text" id="note-title" required>
        <br>
        <label for="note-content">Content:</label>
        <textarea id="note-content" required></textarea>
        <br>
        <button id="create-note-btn">Create Note</button>
    </form>

    <h2>Search Notes</h2>
    <input type="text" id="search-query" placeholder="Search by title or content">
    <button id="search-btn">Search</button>
    <ul id="search-results"></ul>
</body>
</html>
