<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ post.title }} - Blog</title>
    <link rel="stylesheet" href="{% static 'blog_app/styles.css' %}">
</head>
<body>
    <div class="container">
        <header>
            <h1>{{ post.title }}</h1>
            <p>Published on {{ post.publish_date }}</p>
        </header>
        <article>
            <p>{{ post.content }}</p>
        </article>
        <footer>
            <a href="{% url 'blog_app:index' %}">Back to Home</a>
        </footer>
    </div>
</body>
</html>
