<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Post</title>
    <link rel="stylesheet" href="{% static 'blog_app/css/styles.css' %}">
</head>
<body>
    <div class="container">
        <h1>Create a New Post</h1>
        <form method="POST" action="{% url 'blog_app:create_post' %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="title">Title:</label>
                <input type="text" id="title" name="title" required>
            </div>
            <div class="form-group">
                <label for="content">Content:</label>
                <textarea id="content" name="content" rows="10" required></textarea>
            </div>
            <div class="form-group">
                <label for="publish_date">Publish Date:</label>
                <input type="date" id="publish_date" name="publish_date" required>
            </div>
            <button type="submit">Submit</button>
        </form>
        <a href="{% url 'blog_app:post_list' %}">Back to Post List</a>
    </div>
</body>
</html>
