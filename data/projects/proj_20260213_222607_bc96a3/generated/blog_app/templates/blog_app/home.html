{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Blog Website</title>
</head>
<body>
    <header>
        <h1>Welcome to My Blog</h1>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/post/new/">Create Post</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="posts">
            <h2>Recent Posts</h2>
            {% for post in posts %}
                <article class="post">
                    <h3>{{ post.title }}</h3>
                    <p>{{ post.content }}</p>
                    <p><small>Published on {{ post.publish_date }}</small></p>
                </article>
            {% empty %}
                <p>No posts available.</p>
            {% endfor %}
        </section>
    </main>

    <footer>
        <p>&copy; 2023 Simple Blog Website</p>
    </footer>
</body>
</html>
