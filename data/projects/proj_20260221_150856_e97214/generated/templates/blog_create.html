<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Blog</title>
</head>
<body>
    <h1>Create a New Blog</h1>
    <form id="create-blog-form" action="/api/blogs" method="POST" enctype="multipart/form-data">
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" required><br><br>

        <label for="content">Content:</label><br>
        <textarea id="content" name="content" rows="10" cols="50" required></textarea><br><br>

        <label for="image">Upload Image:</label>
        <input type="file" id="image" name="image" accept="image/*" required><br><br>

        <button type="submit">Create Blog</button>
    </form>

    <script>
        document.getElementById('create-blog-form').addEventListener('submit', async function(event) {
            event.preventDefault();

            const title = document.getElementById('title').value.trim();
            const content = document.getElementById('content').value.trim();
            const image = document.getElementById('image').files[0];

            if (!title || !content || !image) {
                alert('All fields are required, including an image.');
                return;
            }

            const formData = new FormData(this);

            try {
                const response = await fetch('/api/blogs', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    alert('Blog created successfully!');
                    window.location.href = '/blogs';
                } else {
                    const errorData = await response.json();
                    alert(`Failed to create blog: ${errorData.error || 'Unknown error'}`);
                }
            } catch (error) {
                alert('An error occurred while creating the blog. Please try again later.');
            }
        });
    </script>
</body>
</html>
