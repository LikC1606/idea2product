<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog List</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <h1>Blog List</h1>
    <div id="blog-container">
        <!-- Blog entries will be dynamically loaded here -->
    </div>

    <script>
        async function fetchBlogs() {
            const response = await fetch('/api/blogs');
            const blogs = await response.json();

            const container = document.getElementById('blog-container');
            blogs.forEach(blog => {
                const blogDiv = document.createElement('div');
                blogDiv.className = 'blog-entry';

                const title = document.createElement('h2');
                title.textContent = blog.title;

                const content = document.createElement('p');
                content.textContent = blog.content.substring(0, 100) + '...';

                const image = document.createElement('img');
                image.src = blog.image_path;
                image.alt = blog.title;
                image.style.width = '150px';

                const createdAt = document.createElement('p');
                createdAt.textContent = `Created at: ${new Date(blog.created_at).toLocaleDateString()}`;

                const viewButton = document.createElement('a');
                viewButton.href = `/blogs/${blog.id}`;
                viewButton.textContent = 'View Details';
                viewButton.className = 'button';

                const editButton = document.createElement('a');
                editButton.href = `/blogs/${blog.id}/edit`;
                editButton.textContent = 'Edit';
                editButton.className = 'button';

                const deleteButton = document.createElement('button');
                deleteButton.textContent = 'Delete';
                deleteButton.className = 'button';
                deleteButton.onclick = async () => {
                    const confirmDelete = confirm('Are you sure you want to delete this blog?');
                    if (confirmDelete) {
                        await fetch(`/api/blogs/${blog.id}`, { method: 'DELETE' });
                        location.reload();
                    }
                };

                blogDiv.appendChild(title);
                blogDiv.appendChild(content);
                blogDiv.appendChild(image);
                blogDiv.appendChild(createdAt);
                blogDiv.appendChild(viewButton);
                blogDiv.appendChild(editButton);
                blogDiv.appendChild(deleteButton);

                container.appendChild(blogDiv);
            });
        }

        fetchBlogs();
    </script>
</body>
</html>
