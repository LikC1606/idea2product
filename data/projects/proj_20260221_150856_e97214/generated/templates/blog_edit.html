<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Blog</title>
</head>
<body>
    <h1>Edit Blog</h1>
    <form id="edit-blog-form" method="POST" enctype="multipart/form-data">
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" value="{{ blog.title }}" required>
        <br>

        <label for="content">Content:</label>
        <textarea id="content" name="content" required>{{ blog.content }}</textarea>
        <br>

        <label for="image">Image:</label>
        <input type="file" id="image" name="image" accept="image/*">
        <br>

        {% if blog.image_path %}
        <p>Current Image:</p>
        <img src="{{ blog.image_path }}" alt="Blog Image" style="max-width: 200px;">
        {% endif %}

        <button type="submit">Save Changes</button>
    </form>

    <script>
        const form = document.getElementById('edit-blog-form');
        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            const title = document.getElementById('title').value.trim();
            const content = document.getElementById('content').value.trim();
            const image = document.getElementById('image').files[0];

            if (!title || !content) {
                alert('Title and content are required.');
                return;
            }

            if (image && !image.type.startsWith('image/')) {
                alert('Uploaded file must be an image.');
                return;
            }

            const formData = new FormData(form);
            try {
                const response = await fetch(`/api/blogs/{{ blog.id }}`, {
                    method: 'PUT',
                    body: formData
                });

                if (response.ok) {
                    alert('Blog updated successfully!');
                    window.location.href = `/blogs/{{ blog.id }}`;
                } else {
                    const errorData = await response.json();
                    alert(`Failed to update blog: ${errorData.error || 'Unknown error'}`);
                }
            } catch (error) {
                alert('An error occurred while updating the blog. Please try again later.');
            }
        });
    </script>
</body>
</html>
