<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Solution</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="/">Home</a>
            <a href="/problems">Problems</a>
            <a href="/profile">Profile</a>
            <a href="/leaderboard">Leaderboard</a>
        </nav>
    </header>
    <main>
        <h1>Submit Your Solution</h1>
        <form action="/submit" method="POST" enctype="multipart/form-data">
            <label for="problem_id">Select Problem:</label>
            <select name="problem_id" id="problem_id" required>
                <!-- Populate problem options dynamically -->
            </select>

            <label for="solution_file">Upload Solution:</label>
            <input type="file" name="solution_file" id="solution_file" required>

            <button type="submit">Submit</button>
        </form>
    </main>
    <script src="/static/js/app.js"></script>
</body>
</html>
