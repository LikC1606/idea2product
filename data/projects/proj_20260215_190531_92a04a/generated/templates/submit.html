<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Solution</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="/">Home</a>
            <a href="/profile">Profile</a>
            <a href="/leaderboard">Leaderboard</a>
        </nav>
    </header>
    <main>
        <section>
            <h1>Submit Your Solution</h1>
            <form method="POST" action="/problem/{{ problem_id }}/submit">
                <textarea name="solution_code" placeholder="Write your code here..." rows="15" cols="80" required></textarea>
                <br>
                <button type="submit">Submit</button>
            </form>
        </section>
    </main>
    <footer>
        <p>ACM Problem-Solving Platform &copy; 2023</p>
    </footer>
    <script src="/static/js/app.js"></script>
</body>
</html>
