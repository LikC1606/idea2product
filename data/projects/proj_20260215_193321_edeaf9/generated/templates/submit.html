<!-- templates/submit.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Solution</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <header>
        <h1>ACM Problem-Solving Platform</h1>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/problems">Problems</a></li>
                <li><a href="/profile">Profile</a></li>
                <li><a href="/leaderboard">Leaderboard</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h2>Submit Solution</h2>
        <form action="/submit" method="POST" enctype="multipart/form-data">
            <label for="problem_id">Problem ID:</label>
            <input type="text" id="problem_id" name="problem_id" required>

            <label for="language">Programming Language:</label>
            <select id="language" name="language" required>
                <option value="python">Python</option>
                <option value="java">Java</option>
                <option value="cpp">C++</option>
                <option value="c">C</option>
            </select>

            <label for="code">Code:</label>
            <textarea id="code" name="code" rows="10" required></textarea>

            <button type="submit">Submit</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2023 ACM Problem-Solving Platform</p>
    </footer>
</body>
</html>
