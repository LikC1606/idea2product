<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Solution</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <header>
        <h1>Submit Your Solution</h1>
    </header>
    <main>
        <form action="/solutions" method="POST">
            <div>
                <label for="user_id">User ID:</label>
                <input type="text" id="user_id" name="user_id" required>
            </div>
            <div>
                <label for="problem_id">Problem ID:</label>
                <input type="text" id="problem_id" name="problem_id" required>
            </div>
            <div>
                <label for="language">Programming Language:</label>
                <select id="language" name="language" required>
                    <option value="python">Python</option>
                    <option value="java">Java</option>
                    <option value="cpp">C++</option>
                    <option value="javascript">JavaScript</option>
                </select>
            </div>
            <div>
                <label for="code">Code:</label>
                <textarea id="code" name="code" rows="10" required></textarea>
            </div>
            <button type="submit">Submit</button>
        </form>
    </main>
    <footer>
        <p>&copy; ACM Problem-Solving Platform</p>
    </footer>
</body>
</html>
