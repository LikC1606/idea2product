<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Solution</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/js/app.js" defer></script>
</head>
<body>
    <header>
        <h1>Submit Your Solution</h1>
    </header>
    <main>
        <form id="submit-form" action="/submit" method="POST">
            <label for="problem-id">Problem ID:</label>
            <input type="text" id="problem-id" name="problem_id" required>
            
            <label for="code">Solution Code:</label>
            <textarea id="code" name="code" rows="10" required></textarea>
            
            <button type="submit">Submit</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2023 ACM Problem-Solving Platform</p>
    </footer>
</body>
</html>
