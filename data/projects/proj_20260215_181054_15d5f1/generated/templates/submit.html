<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Solution</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Submit Your Solution</h1>
        </header>
        <main>
            <form action="/solution/submit" method="POST" id="submitForm">
                <div class="form-group">
                    <label for="problem_id">Select Problem:</label>
                    <select id="problem_id" name="problem_id" required>
                        <!-- Problems will be dynamically populated -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="language">Choose Language:</label>
                    <select id="language" name="language" required>
                        <option value="python">Python</option>
                        <option value="java">Java</option>
                        <option value="cpp">C++</option>
                        <option value="javascript">JavaScript</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="solution_code">Your Code:</label>
                    <textarea id="solution_code" name="solution_code" rows="10" required></textarea>
                </div>
                <button type="submit" class="btn-submit">Submit</button>
            </form>
        </main>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const problemSelect = document.getElementById("problem_id");

            try {
                const response = await fetch("/problem/all");
                const problems = await response.json();

                problems.forEach(problem => {
                    const option = document.createElement("option");
                    option.value = problem.id;
                    option.textContent = `${problem.id}: ${problem.title}`;
                    problemSelect.appendChild(option);
                });
            } catch (error) {
                console.error("Failed to load problems:", error);
            }
        });
    </script>
</body>
</html>
