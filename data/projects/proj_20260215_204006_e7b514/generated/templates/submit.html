<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Solution</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <header>
        <h1>Submit Your Solution</h1>
        <nav>
            <a href="/">Home</a>
            <a href="/problems">Problems</a>
            <a href="/users">Profile</a>
        </nav>
    </header>
    <main>
        <form action="/solutions" method="POST">
            <label for="problem_id">Problem:</label>
            <select name="problem_id" id="problem_id" required>
                <!-- Dynamically populate problems -->
                {% for problem in problems %}
                <option value="{{ problem.id }}">{{ problem.title }}</option>
                {% endfor %}
            </select>

            <label for="user_id">User:</label>
            <select name="user_id" id="user_id" required>
                <!-- Dynamically populate users -->
                {% for user in users %}
                <option value="{{ user.id }}">{{ user.name }}</option>
                {% endfor %}
            </select>

            <label for="code">Solution Code:</label>
            <textarea name="code" id="code" rows="10" cols="50" required></textarea>

            <button type="submit">Submit</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2023 ACM Problem-Solving Platform</p>
    </footer>
</body>
</html>
