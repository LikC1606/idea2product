<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management App</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        nav { margin-bottom: 20px; }
        nav a { margin-right: 15px; }
        .task-form, .task-list { margin-top: 20px; }
    </style>
    <script>
        async function fetchTasks() {
            const response = await fetch('/api/tasks');
            const tasks = await response.json();
            const taskList = document.getElementById('task-list');
            taskList.innerHTML = '';
            tasks.forEach(task => {
                const taskItem = document.createElement('li');
                taskItem.textContent = `${task.title} - ${task.status}`;
                taskList.appendChild(taskItem);
            });
        }

        async function createTask(event) {
            event.preventDefault();
            const title = document.getElementById('task-title').value;
            const description = document.getElementById('task-description').value;
            const status = document.getElementById('task-status').value;

            await fetch('/api/tasks', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ title, description, status })
            });

            fetchTasks();
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchTasks();
            document.getElementById('task-form').addEventListener('submit', createTask);
        });
    </script>
</head>
<body>
    <h1>Task Management App</h1>
    <nav>
        <a href="/">Home</a>
        <a href="/api/tasks">Tasks API</a>
    </nav>
    <div class="task-form">
        <h2>Create Task</h2>
        <form id="task-form">
            <label for="task-title">Title:</label>
            <input type="text" id="task-title" required><br>
            <label for="task-description">Description:</label>
            <input type="text" id="task-description"><br>
            <label for="task-status">Status:</label>
            <input type="text" id="task-status" required><br>
            <button type="submit">Create Task</button>
        </form>
    </div>
    <div class="task-list">
        <h2>Task List</h2>
        <ul id="task-list"></ul>
    </div>
</body>
</html>
