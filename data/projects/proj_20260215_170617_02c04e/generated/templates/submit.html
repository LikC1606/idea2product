<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Code</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/js/app.js" defer></script>
</head>
<body>
    <header>
        <nav>
            <a href="/">Home</a>
            <a href="/problems">Problems</a>
            <a href="/profile">Profile</a>
        </nav>
    </header>
    <main>
        <section class="submit-section">
            <h1>Submit Your Code</h1>
            <form action="/submit" method="post" enctype="multipart/form-data">
                <label for="problem_id">Select Problem:</label>
                <select id="problem_id" name="problem_id" required>
                    <!-- Options for problems will be dynamically generated by the backend -->
                </select>

                <label for="language">Programming Language:</label>
                <select id="language" name="language" required>
                    <option value="python">Python</option>
                    <option value="cpp">C++</option>
                    <option value="java">Java</option>
                    <!-- Add more languages as needed -->
                </select>

                <label for="code">Paste Your Code:</label>
                <textarea id="code" name="code" rows="10" required></textarea>

                <button type="submit">Submit Code</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 ACM Problem-Solving Platform</p>
    </footer>
</body>
</html>
