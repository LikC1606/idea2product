<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACM Problem-Solving Platform</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <header>
        <h1>ACM Problem-Solving Platform</h1>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/leaderboard">Leaderboard</a></li>
                <li><a href="/profile">Profile</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="problem-list">
            <h2>Problem List</h2>
            <table>
                <thead>
                    <tr>
                        <th>Problem ID</th>
                        <th>Title</th>
                        <th>Difficulty</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Dynamic content will populate this table -->
                </tbody>
            </table>
        </section>

        <section id="leaderboard">
            <h2>Leaderboard</h2>
            <table>
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Username</th>
                        <th>Points</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Dynamic content will populate this table -->
                </tbody>
            </table>
        </section>

        <section id="code-submission">
            <h2>Submit Your Code</h2>
            <form action="/submit" method="post">
                <label for="problem-id">Problem ID:</label>
                <input type="text" id="problem-id" name="problem-id" required>
                
                <label for="language">Language:</label>
                <select id="language" name="language" required>
                    <option value="python">Python</option>
                    <option value="cpp">C++</option>
                    <option value="java">Java</option>
                </select>
                
                <label for="code">Code:</label>
                <textarea id="code" name="code" rows="10" required></textarea>
                
                <button type="submit">Submit</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2023 ACM Problem-Solving Platform</p>
    </footer>

    <script src="/static/js/app.js"></script>
</body>

</html>
