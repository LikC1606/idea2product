<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Solution</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <header>
        <h1>ACM Problem-Solving Platform</h1>
        <nav>
            <a href="/problems">Problem Library</a>
            <a href="/profile">Profile</a>
            <a href="/leaderboard">Leaderboard</a>
        </nav>
    </header>
    
    <main>
        <section class="submission-form">
            <h2>Submit your solution</h2>
            <form action="/submit-solution" method="POST" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="problem-id">Problem:</label>
                    <select id="problem-id" name="problem_id" required>
                        {% for problem in problems %}
                        <option value="{{ problem.id }}">{{ problem.title }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="code">Your Code:</label>
                    <textarea id="code" name="code" rows="10" required></textarea>
                </div>
                <div class="form-group">
                    <label for="language">Language:</label>
                    <select id="language" name="language" required>
                        <option value="python">Python</option>
                        <option value="java">Java</option>
                        <option value="cpp">C++</option>
                        <option value="javascript">JavaScript</option>
                    </select>
                </div>
                <button type="submit" class="submit-btn">Submit</button>
            </form>
        </section>
    </main>
    
    <footer>
        <p>&copy; 2023 ACM Problem-Solving Platform</p>
    </footer>
</body>
</html>
