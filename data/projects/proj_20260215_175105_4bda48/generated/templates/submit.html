<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Submission</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <script src="/static/js/submit.js" defer></script>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/problems">Problems</a></li>
                <li><a href="/profile">Profile</a></li>
                <li><a href="/leaderboard">Leaderboard</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Submit Your Solution</h1>
        <form id="submit-form" method="POST" action="/submit-solution">
            <div>
                <label for="problem-id">Problem</label>
                <select id="problem-id" name="problem_id" required>
                    <!-- Options will be dynamically populated -->
                </select>
            </div>
            <div>
                <label for="language">Language</label>
                <select id="language" name="language" required>
                    <option value="python">Python</option>
                    <option value="cpp">C++</option>
                    <option value="java">Java</option>
                    <option value="javascript">JavaScript</option>
                </select>
            </div>
            <div>
                <label for="code">Code</label>
                <textarea id="code" name="code" rows="15" required></textarea>
            </div>
            <button type="submit">Submit</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2023 ACM Problem-Solving Platform</p>
    </footer>
    <script>
        // Dynamically populate the problems dropdown
        document.addEventListener('DOMContentLoaded', async () => {
            const problemSelect = document.getElementById('problem-id');
            try {
                const response = await fetch('/api/problems');
                const problems = await response.json();
                problems.forEach(problem => {
                    const option = document.createElement('option');
                    option.value = problem.id;
                    option.textContent = `${problem.id} - ${problem.title}`;
                    problemSelect.appendChild(option);
                });
            } catch (error) {
                console.error('Error fetching problems:', error);
            }
        });
    </script>
</body>
</html>
