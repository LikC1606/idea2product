<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Solution</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <header>
        <h1>ACM Problem-Solving Platform</h1>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/problems">Problems</a></li>
                <li><a href="/leaderboard">Leaderboard</a></li>
                <li><a href="/profile">Profile</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Submit Your Solution</h2>
            <form method="POST" action="/solutions" enctype="multipart/form-data">
                <label for="problem_id">Problem ID:</label>
                <input type="number" id="problem_id" name="problem_id" required>

                <label for="code_file">Code File:</label>
                <input type="file" id="code_file" name="code_file" accept=".py,.java,.cpp,.c" required>

                <label for="language">Programming Language:</label>
                <select id="language" name="language" required>
                    <option value="python">Python</option>
                    <option value="java">Java</option>
                    <option value="cpp">C++</option>
                    <option value="c">C</option>
                </select>

                <button type="submit">Submit</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2023 ACM Problem-Solving Platform</p>
    </footer>
</body>
</html>
