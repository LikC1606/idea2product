<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Solution</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/problems">Problems</a></li>
                <li><a href="/leaderboard">Leaderboard</a></li>
                <li><a href="/profile">Profile</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Submit Your Solution</h1>
        <form action="/solution/submit" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="problem-id">Problem ID:</label>
                <select name="problem_id" id="problem-id" required>
                    {% for problem in problems %}
                        <option value="{{ problem.id }}">{{ problem.title }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="language">Programming Language:</label>
                <select name="language" id="language" required>
                    <option value="python">Python</option>
                    <option value="java">Java</option>
                    <option value="cpp">C++</option>
                    <option value="javascript">JavaScript</option>
                </select>
            </div>
            <div class="form-group">
                <label for="code">Code:</label>
                <textarea name="code" id="code" rows="10" required></textarea>
            </div>
            <button type="submit">Submit</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2023 ACM Problem-Solving Platform. All Rights Reserved.</p>
    </footer>
</body>
</html>
