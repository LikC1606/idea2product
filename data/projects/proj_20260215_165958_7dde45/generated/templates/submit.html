<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Your Solution</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/problems">Problems</a></li>
                <li><a href="/profile">Profile</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="submission-form">
            <h1>Submit Your Solution</h1>
            <form id="codeSubmissionForm" action="/submit" method="POST">
                <div class="form-group">
                    <label for="problem-id">Problem ID:</label>
                    <input type="text" id="problem-id" name="problem_id" required>
                </div>
                <div class="form-group">
                    <label for="language">Programming Language:</label>
                    <select id="language" name="language" required>
                        <option value="python">Python</option>
                        <option value="java">Java</option>
                        <option value="cpp">C++</option>
                        <option value="javascript">JavaScript</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="code">Your Code:</label>
                    <textarea id="code" name="code" rows="10" required></textarea>
                </div>
                <button type="submit">Submit</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 ACM Problem-Solving Platform</p>
    </footer>
    <script src="/static/js/app.js"></script>
</body>
</html>
