<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Solution</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</head>
<body>
    <header>
        <h1>Submit Your Solution</h1>
    </header>
    <main>
        <form action="{{ url_for('solution.submit') }}" method="POST" enctype="multipart/form-data">
            <div>
                <label for="problem_id">Problem ID:</label>
                <input type="text" id="problem_id" name="problem_id" required>
            </div>
            <div>
                <label for="language">Programming Language:</label>
                <select id="language" name="language" required>
                    <option value="python">Python</option>
                    <option value="cpp">C++</option>
                    <option value="java">Java</option>
                    <option value="javascript">JavaScript</option>
                </select>
            </div>
            <div>
                <label for="code">Code:</label>
                <textarea id="code" name="code" rows="10" cols="50" required></textarea>
            </div>
            <button type="submit">Submit</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2023 ACM Problem-Solving Platform</p>
    </footer>
</body>
</html>
