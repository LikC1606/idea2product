<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Note-Taking App</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Simple Note-Taking App</h1>
        <form method="POST" action="{{ url_for('notes_bp.add_note') }}" class="mb-4">
            <div class="mb-3">
                <label for="note_content" class="form-label">Enter your note:</label>
                <textarea id="note_content" name="content" class="form-control" rows="3" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Save Note</button>
        </form>
        <h2 class="mt-5">Saved Notes</h2>
        <ul class="list-group">
            {% for note in notes %}
            <li class="list-group-item">
                <strong>{{ note.timestamp.strftime('%Y-%m-%d %H:%M:%S') }}</strong>: {{ note.content }}
            </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
