<!DOCTYPE html>
<html>
<head>
    <title>Notes</title>
    <script>
        const API_BASE = '/api';

        async function fetchNotes() {
            const response = await fetch(`${API_BASE}/notes`);
            const notes = await response.json();
            const notesList = document.getElementById('notes-list');
            notesList.innerHTML = '';
            notes.forEach(note => {
                const li = document.createElement('li');
                li.textContent = `${note.content} (Created at: ${note.created_at})`;
                notesList.appendChild(li);
            });
        }

        async function createNote() {
            const content = document.getElementById('note-content').value;
            const response = await fetch(`${API_BASE}/notes`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({content})
            });
            if (response.ok) {
                fetchNotes();
            }
        }

        async function deleteNote() {
            const id = document.getElementById('note-id').value;
            const response = await fetch(`${API_BASE}/notes/${id}`, {
                method: 'DELETE'
            });
            if (response.ok) {
                fetchNotes();
            }
        }

        async function updateNote() {
            const id = document.getElementById('update-note-id').value;
            const content = document.getElementById('update-note-content').value;
            const response = await fetch(`${API_BASE}/notes/${id}`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({content})
            });
            if (response.ok) {
                fetchNotes();
            }
        }

        document.addEventListener('DOMContentLoaded', fetchNotes);
    </script>
</head>
<body>
    <h1>Notes</h1>
    <ul id="notes-list"></ul>

    <h2>Create Note</h2>
    <input type="text" id="note-content" placeholder="Note content">
    <button onclick="createNote()">Create</button>

    <h2>Delete Note</h2>
    <input type="number" id="note-id" placeholder="Note ID">
    <button onclick="deleteNote()">Delete</button>

    <h2>Update Note</h2>
    <input type="number" id="update-note-id" placeholder="Note ID">
    <input type="text" id="update-note-content" placeholder="New content">
    <button onclick="updateNote()">Update</button>
</body>
</html>
