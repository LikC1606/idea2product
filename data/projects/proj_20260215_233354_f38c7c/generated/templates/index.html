<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Note-Taking App</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Simple Note-Taking App</h1>
        <form method="POST" action="/save">
            <div class="mb-3">
                <label for="noteContent" class="form-label">Write your note:</label>
                <textarea class="form-control" id="noteContent" name="content" rows="4" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Save Note</button>
        </form>
        <hr>
        <h2>Saved Notes</h2>
        <ul class="list-group">
            {% for note in notes %}
                <li class="list-group-item">{{ note.content }}</li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
