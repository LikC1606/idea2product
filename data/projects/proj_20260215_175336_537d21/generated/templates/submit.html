<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Code</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/problems">Problem Library</a></li>
                <li><a href="/profile">Profile</a></li>
                <li><a href="/leaderboard">Leaderboard</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="submit-section">
            <h1>Submit Your Code</h1>
            <form action="/submit" method="POST" enctype="multipart/form-data">
                <label for="problem_id">Problem ID:</label>
                <input type="text" id="problem_id" name="problem_id" placeholder="Enter the problem ID" required>
                
                <label for="language">Programming Language:</label>
                <select id="language" name="language" required>
                    <option value="python">Python</option>
                    <option value="cpp">C++</option>
                    <option value="java">Java</option>
                    <option value="javascript">JavaScript</option>
                </select>

                <label for="code">Your Code:</label>
                <textarea id="code" name="code" rows="10" placeholder="Paste your code here..." required></textarea>
                
                <button type="submit">Submit</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2023 ACM Problem-Solving Platform</p>
    </footer>
</body>
</html>
