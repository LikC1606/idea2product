<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Solution</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/js/app.js" defer></script>
</head>
<body>
    <header>
        <h1>ACM Problem-Solving Platform</h1>
        <nav>
            <a href="/">Home</a>
            <a href="/problems">Problems</a>
            <a href="/leaderboard">Leaderboard</a>
            <a href="/profile">Profile</a>
        </nav>
    </header>
    <main>
        <h2>Submit Your Solution</h2>
        <form action="/submit" method="post">
            <label for="problem_id">Problem ID:</label>
            <input type="text" id="problem_id" name="problem_id" required>
            
            <label for="language">Programming Language:</label>
            <select id="language" name="language" required>
                <option value="python">Python</option>
                <option value="java">Java</option>
                <option value="cpp">C++</option>
            </select>
            
            <label for="code">Code:</label>
            <textarea id="code" name="code" rows="10" cols="50" required></textarea>
            
            <button type="submit">Submit</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2023 ACM Problem-Solving Platform</p>
    </footer>
</body>
</html>
