<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Problem Page</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <header>
        <h1>Problem Page</h1>
    </header>
    <main>
        <form method="POST" action="/problem/save">
            <div>
                <label for="problem_title">Title:</label>
                <input type="text" id="problem_title" name="problem_title" required>
            </div>
            <div>
                <label for="problem_description">Description:</label>
                <textarea id="problem_description" name="problem_description" required></textarea>
            </div>
            <button type="submit">Save Problem</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2023 Simple Note-Taking App</p>
    </footer>
</body>
</html>
