<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Submission</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Submit Your Solution</h1>
        </header>
        <main>
            <form id="submit-form" action="/submit" method="POST">
                <div class="form-group">
                    <label for="problem-id">Problem ID:</label>
                    <input type="text" id="problem-id" name="problem_id" required>
                </div>
                <div class="form-group">
                    <label for="language">Language:</label>
                    <select id="language" name="language" required>
                        <option value="python">Python</option>
                        <option value="java">Java</option>
                        <option value="cpp">C++</option>
                        <option value="javascript">JavaScript</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="code">Code:</label>
                    <textarea id="code" name="code" rows="10" required></textarea>
                </div>
                <button type="submit" class="btn">Submit</button>
            </form>
        </main>
        <footer>
            <p>&copy; 2023 ACM Problem-Solving Platform</p>
        </footer>
    </div>
    <script src="/static/js/app.js"></script>
</body>
</html>
