<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Solution</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
    <header>
        <h1>Submit Your Solution</h1>
        <nav>
            <a href="{{ url_for('problem_bp.get_problems') }}">Problem Library</a>
            <a href="{{ url_for('user_bp.get_user', user_id=session['user_id']) }}">Profile</a>
            <a href="{{ url_for('solution_bp.get_solutions_by_user', user_id=session['user_id']) }}">My Solutions</a>
            <a href="{{ url_for('user_bp.logout') }}">Logout</a>
        </nav>
    </header>

    <main>
        <form action="{{ url_for('solution_bp.create_solution') }}" method="POST">
            <input type="hidden" name="user_id" value="{{ session['user_id'] }}">
            <label for="problem_id">Select Problem:</label>
            <select name="problem_id" id="problem_id" required>
                {% for problem in problems %}
                    <option value="{{ problem.id }}">{{ problem.title }}</option>
                {% endfor %}
            </select>

            <label for="content">Solution Code:</label>
            <textarea name="content" id="content" rows="10" required></textarea>

            <button type="submit">Submit</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2023 ACM Problem-Solving Platform</p>
    </footer>
</body>

</html>
