<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Content Generator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <header>
        <h1>Product Content Generator</h1>
    </header>
    <main>
        <form id="content-form" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="product-image">Upload Product Image:</label>
                <input type="file" id="product-image" name="product_image" required>
            </div>
            <div class="form-group">
                <label for="description">Describe Your Needs:</label>
                <textarea id="description" name="description" rows="4" placeholder="Enter a brief description..." required></textarea>
            </div>
            <button type="submit" id="generate-btn">Generate Product Content</button>
        </form>
        <section id="results-section" style="display: none;">
            <h2>Generated Content</h2>
            <p><strong>Title:</strong> <span id="product-title"></span></p>
            <h3>Selling Points:</h3>
            <ul id="selling-points">
                <li id="point-1"></li>
                <li id="point-2"></li>
                <li id="point-3"></li>
            </ul>
        </section>
    </main>
    <script src="{{ url_for('static', filename='js/scripts.js') }}"></script>
</body>
</html>
