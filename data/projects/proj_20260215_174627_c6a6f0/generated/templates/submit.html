<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Submission</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <header>
        <h1>ACM Problem-Solving Platform</h1>
        <nav>
            <ul>
                <li><a href="/problems">Problem Library</a></li>
                <li><a href="/leaderboard">Leaderboard</a></li>
                <li><a href="/profile">Profile</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="submit-section">
            <h2>Submit Code</h2>
            <form id="submit-form" action="/solution/submit" method="POST">
                <label for="problem-id">Problem:</label>
                <select id="problem-id" name="problem_id" required>
                    {% for problem in problems %}
                    <option value="{{ problem.id }}">{{ problem.title }}</option>
                    {% endfor %}
                </select>

                <label for="code">Code:</label>
                <textarea id="code" name="code" rows="10" cols="80" required placeholder="Write your solution here..."></textarea>

                <label for="language">Language:</label>
                <select id="language" name="language" required>
                    <option value="python">Python</option>
                    <option value="cpp">C++</option>
                    <option value="java">Java</option>
                </select>

                <button type="submit">Submit</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 ACM Problem-Solving Platform. All rights reserved.</p>
    </footer>
</body>
</html>
