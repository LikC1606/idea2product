<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note-Taking Application</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <header>
        <h1>Note-Taking Application</h1>
    </header>
    <main>
        <section id="create-note">
            <h2>Create a New Note</h2>
            <form id="note-form">
                <label for="title">Title:</label>
                <input type="text" id="title" name="title" required>
                <label for="content">Content:</label>
                <textarea id="content" name="content" required></textarea>
                <button type="submit">Save Note</button>
            </form>
        </section>
        <section id="notes-list">
            <h2>Your Notes</h2>
            <div id="notes-container">
                <!-- Notes will be dynamically loaded here -->
            </div>
        </section>
        <section id="search-notes">
            <h2>Search Notes</h2>
            <form id="search-form">
                <input type="text" id="search-query" name="search-query" placeholder="Search notes...">
                <button type="submit">Search</button>
            </form>
            <div id="search-results">
                <!-- Search results will be displayed here -->
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 Note-Taking Application</p>
    </footer>
    <script src="/static/js/main.js"></script>
</body>
</html>
