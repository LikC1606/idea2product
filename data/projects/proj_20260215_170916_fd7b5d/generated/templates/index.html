<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACM Problem-Solving Platform</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/js/app.js" defer></script>
</head>
<body>
    <header>
        <h1>ACM Problem-Solving Platform</h1>
        <nav>
            <ul>
                <li><a href="/problems">问题库</a></li>
                <li><a href="/leaderboard">排行榜</a></li>
                <li><a href="/profile">个人资料</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="problem-list">
            <h2>问题列表</h2>
            <ul>
                <!-- Problems will be dynamically loaded here -->
            </ul>
        </section>
        <section id="leaderboard">
            <h2>排行榜</h2>
            <table>
                <thead>
                    <tr>
                        <th>排名</th>
                        <th>用户名</th>
                        <th>分数</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Leaderboard data will be dynamically loaded here -->
                </tbody>
            </table>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 ACM Problem-Solving Platform</p>
    </footer>
