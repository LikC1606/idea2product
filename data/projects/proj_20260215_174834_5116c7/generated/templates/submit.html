<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Solution</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/problems">Problems</a></li>
                <li><a href="/profile">Profile</a></li>
                <li><a href="/leaderboard">Leaderboard</a></li>
                <li><a href="/logout">Logout</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="submit-page">
            <h1>Submit Your Solution</h1>
            <form action="/submit" method="POST">
                <div class="form-group">
                    <label for="problem_id">Select Problem:</label>
                    <select name="problem_id" id="problem_id" required>
                        <!-- Option values will be dynamically populated -->
                        {% for problem in problems %}
                        <option value="{{ problem.id }}">{{ problem.title }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="language">Select Language:</label>
                    <select name="language" id="language" required>
                        <option value="python">Python</option>
                        <option value="java">Java</option>
                        <option value="c++">C++</option>
                        <option value="javascript">JavaScript</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="code">Your Code:</label>
                    <textarea name="code" id="code" rows="15" required></textarea>
                </div>
                <button type="submit">Submit</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 ACM Problem-Solving Platform</p>
    </footer>
</body>
</html>
