<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Note-Taking App</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <h1>Note-Taking App</h1>
        <form id="note-form">
            <label for="note-input">Enter your note:</label>
            <textarea id="note-input" name="note" rows="4" cols="50" placeholder="Write your note here..."></textarea>
            <button type="submit">Save Note</button>
        </form>
        <h2>Saved Notes</h2>
        <ul id="notes-list"></ul>
    </div>
    <script src="/static/scripts.js"></script>
</body>
</html>
